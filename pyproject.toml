[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossmodal-vlm-robustness"
version = "0.1.0"
description = "Reproducible small-scale research on image-text conflicts and adversarial robustness in VLMs"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<14",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.56,<6",
  "accelerate>=1.0,<3",
  "num2words>=0.5.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

